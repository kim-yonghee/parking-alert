name: Parking Check Alert

on:
  repository_dispatch:
    types: [run-parking-check]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parking-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run parking check
        env:
          CAR_NUMBER: ${{ secrets.CAR_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_URL: ${{ secrets.API_URL }}
        run: python check_parking.py
      - name: Save state
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ ! -f parking_state.json ]; then
            exit 0
          fi
          git add -- parking_state.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update parking state"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          exit 1
