name: Parking Check Alert

on:
  schedule:
    - cron: '*/5 22-23,0-14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parking-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run parking check
        env:
          CAR_NUMBER: ${{ secrets.CAR_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_URL: ${{ secrets.API_URL }}
        run: python check_parking.py

      - name: Save state
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A last_state.txt exit_done.txt last_in.txt pending_out.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "push 최종 실패"
          exit 1
